workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android-project/app/build/outputs/apk/debug/*.apk
